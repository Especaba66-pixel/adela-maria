# PostgreSQL local para desarrollar y para las pruebas (misma versión mayor que en producción).
# Uso: docker compose up -d
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - datos:/var/lib/postgresql/data
      - ./infra/crear-bases.sql:/docker-entrypoint-initdb.d/crear-bases.sql:ro
volumes:
  datos:
